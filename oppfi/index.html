<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us Boxes - OppFi Test</title>
  </head>
  <body>
    <style>
      body {
        font-family: sans-serif;
        background: #f2f2f2;
      }
      h1 {
        color: #333;
      }
    </style>

    <h1>OppFi Contact Us Boxes - Test Page</h1>
    <p>Tenant: oppfi | Channels: Apple Business Chat, Web Chat | Convo Starter ID: customer-support</p>

    <script src="https://static.quiq-cdn.com/quiq-contact-us-boxes/index2.0.js"></script>
    <script defer>
      // Use a delimiter that won't conflict with URL parameters
      const intentValue = `action:support|productId:ABC123|userId:user456|source:website`;
      
      window.QuiqContactUs.configure({
        channels: {
          webchat: {
            tenant: 'oppfi',
            options: { 
              pageConfigurationId: 'customer-support',
              context: {
                intent: intentValue
              }
            },
            buttonLabel: 'Stay in web chat',
          },
          abc: {
            appleBusinessId: 'e1393257-e990-405a-abd1-0ab217c51e9b',
            buttonLabel: 'Switch to Apple Messages',
          },
        },
        order: ['webchat','abc'],
      })
      window.QuiqContactUs.render()
      
      // Modify the ABC button links after render
      setTimeout(() => {
        const abcButton = document.getElementById('abcButton');
        if (abcButton) {
          const parentLink = abcButton.parentElement;
          const innerLink = abcButton.querySelector('a');
          
          if (parentLink && parentLink.tagName === 'A') {
            const currentHref = parentLink.getAttribute('href');
            const newHref = currentHref + '?biz-intent-id=' + encodeURIComponent(intentValue);
            parentLink.setAttribute('href', newHref);
          }
          
          if (innerLink) {
            const currentHref = innerLink.getAttribute('href');
            const newHref = currentHref + '?biz-intent-id=' + encodeURIComponent(intentValue);
            innerLink.setAttribute('href', newHref);
          }
        }
      }, 500);
      
      // Match existing web chat launcher icon
      var mainButton = document.getElementById('QuiqContactUsButton')
      mainButton.innerHTML = ''
      mainButton.style.backgroundColor = 'transparent'
      mainButton.style.boxShadow = 'none'
      var icon = document.createElement('img')
      icon.src = 'https://proservices-static-prod.quiq-cdn.com/shared/oppfi/chatbot-icon-final.png'
      icon.style.width = '60px'
      icon.style.height = '60px'
      mainButton.appendChild(icon)
    </script>

  </body>
</html>
