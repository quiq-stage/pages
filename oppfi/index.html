<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platform Selector - OppFi Test</title>
  </head>
  <body>
    <style>
      body {
        font-family: sans-serif;
        background: #f2f2f2;
      }
      h1 {
        color: #333;
      }
    </style>

    <h1>OppFi Platform Selector - Test Page</h1>
    <p>Tenant: oppfi-stage | Standard widget code + setContext(intent) | Convo Starter ID: customer-support</p>

    <script src="https://oppfi-stage.quiq-api.com/app/chat-ui/index.js" charset="UTF-8"></script>
    <script>
      var chat = Quiq({
        pageConfigurationId: 'customer-support'
      });

      // Use a delimiter that won't conflict with URL parameters
      var intentValue = '100123,59313,test_pave';

      // Set whenever the dynamic value is known, before the user clicks a platform button
      chat.setContext({ intent: intentValue }, true);
    </script>
  </body>
</html>
