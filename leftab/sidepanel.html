<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leftab</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-width: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #1e1e2e;
      color: #cdd6f4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 120px;
    }

    /* ── Pinned tiles ── */
    #pinned-section {
      flex-shrink: 0;
      padding: 8px 10px 6px;
      border-bottom: 1px solid #313244;
      display: none; /* hidden when empty */
    }

    #pinned-section.has-pins { display: block; }

    #pinned-tiles {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .pin-tile {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #313244;
      border: 1px solid #45475a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background 0.1s, border-color 0.1s;
      flex-shrink: 0;
    }

    .pin-tile:hover {
      background: #3d3d54;
      border-color: #89b4fa;
    }

    .pin-tile.is-open {
      border-color: #89b4fa44;
    }

    .pin-tile img {
      width: 18px;
      height: 18px;
      border-radius: 3px;
    }

    .pin-tile .letter-icon {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      background: #45475a;
      font-size: 10px;
      color: #a6adc8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pin-tile.dragging { opacity: 0.35; cursor: grabbing; }
    .pin-tile[draggable="true"] { cursor: grab; }
    .pin-tile.drop-before { box-shadow: -3px 0 0 #89b4fa; }
    .pin-tile.drop-after  { box-shadow:  3px 0 0 #89b4fa; }

    .pin-unpin {
      position: absolute;
      top: -5px;
      right: -5px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f38ba8;
      color: #1e1e2e;
      font-size: 10px;
      line-height: 1;
      border: none;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-weight: 700;
    }

    .pin-tile:hover .pin-unpin { display: flex; }

    /* ── Search ── */
    #search-wrap {
      padding: 8px 10px;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }

    #search {
      width: 100%;
      background: #313244;
      border: 1px solid #45475a;
      border-radius: 6px;
      padding: 6px 10px;
      color: #cdd6f4;
      font-size: 12px;
      outline: none;
    }

    #search::placeholder { color: #585b70; }
    #search:focus { border-color: #89b4fa; }

    /* ── Views ── */
    .view {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
      display: none;
    }

    .view.active { display: block; }

    .view::-webkit-scrollbar { width: 4px; }
    .view::-webkit-scrollbar-track { background: transparent; }
    .view::-webkit-scrollbar-thumb { background: #45475a; border-radius: 2px; }

    /* ── Tab items ── */
    .tab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 6px;
      margin: 1px 6px;
      min-width: 0;
      position: relative;
    }

    .tab-item:hover { background: #313244; }

    .tab-item.active {
      background: #2a2a3d;
      border-left: 3px solid #89b4fa;
      padding-left: 7px;
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 2px;
    }

    .favicon-placeholder {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      background: #45475a;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: #6c7086;
    }

    .tab-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #a6adc8;
      font-size: 12px;
    }

    .tab-item.active .tab-title { color: #cdd6f4; }
    .tab-item.loading .tab-title { color: #6c7086; font-style: italic; }
    .tab-item[draggable="true"] { cursor: grab; }
    .tab-item.dragging { opacity: 0.4; cursor: grabbing; }
    .tab-item.drop-above { box-shadow: 0 -2px 0 #89b4fa; }
    .tab-item.drop-below { box-shadow: 0  2px 0 #89b4fa; }

    .tab-actions {
      display: none;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .tab-item:hover .tab-actions { display: flex; }

    .tab-btn {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: #6c7086;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 13px;
      line-height: 1;
    }

    .tab-btn:hover { background: #45475a; color: #cdd6f4; }
    .tab-btn.pinned { color: #89b4fa; }
    .tab-btn.close:hover { background: #f38ba8; color: #1e1e2e; }

    /* ── New Tab button ── */
    #new-tab-btn {
      margin: 6px;
      padding: 7px 12px;
      background: #313244;
      border: 1px solid #45475a;
      border-radius: 6px;
      color: #89b4fa;
      font-size: 12px;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      transition: background 0.1s;
    }

    #new-tab-btn.visible { display: flex; }
    #new-tab-btn:hover { background: #45475a; }

    /* ── Bookmarks ── */
    .bm-folder { margin: 1px 6px; }

    .bm-folder-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      cursor: pointer;
      border-radius: 6px;
      color: #a6adc8;
      font-size: 12px;
      font-weight: 500;
      user-select: none;
    }

    .bm-folder-label:hover { background: #313244; }

    .bm-folder-label .arrow {
      font-size: 9px;
      color: #585b70;
      transition: transform 0.15s;
      flex-shrink: 0;
      width: 10px;
    }

    .bm-folder.open > .bm-folder-label .arrow { transform: rotate(90deg); }
    .bm-folder-icon { font-size: 14px; flex-shrink: 0; }

    .bm-children { padding-left: 12px; display: none; }
    .bm-folder.open > .bm-children { display: block; }

    .bm-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      cursor: pointer;
      border-radius: 6px;
      margin: 1px 0;
      color: #a6adc8;
      font-size: 12px;
      text-decoration: none;
    }

    .bm-link:hover { background: #313244; color: #cdd6f4; }

    .bm-link .bm-favicon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      border-radius: 2px;
    }

    .bm-link .bm-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      padding: 24px 16px;
      text-align: center;
      color: #585b70;
      font-size: 12px;
    }

    /* ── Bottom Nav ── */
    nav {
      display: flex;
      border-top: 1px solid #313244;
      flex-shrink: 0;
      background: #181825;
    }

    nav button {
      flex: 1;
      padding: 10px 0 8px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #585b70;
      font-size: 10px;
      transition: color 0.1s;
    }

    nav button svg { width: 18px; height: 18px; }
    nav button:hover { color: #a6adc8; }
    nav button.active { color: #89b4fa; }
  </style>
</head>
<body>

  <!-- Pinned tiles row -->
  <div id="pinned-section">
    <div id="pinned-tiles"></div>
  </div>

  <div id="search-wrap">
    <input id="search" type="text" placeholder="Search…" autocomplete="off" />
  </div>

  <div id="view-tabs" class="view active"></div>
  <div id="view-bookmarks" class="view"></div>

  <button id="new-tab-btn" class="visible">
    <span>+</span> New Tab
  </button>

  <nav>
    <button id="nav-tabs" class="active" title="Tabs">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="2" y="4" width="16" height="3" rx="1"/>
        <rect x="2" y="9" width="16" height="3" rx="1"/>
        <rect x="2" y="14" width="16" height="3" rx="1"/>
      </svg>
      Tabs
    </button>
    <button id="nav-bookmarks" title="Bookmarks">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M5 3h10a1 1 0 0 1 1 1v13l-6-3-6 3V4a1 1 0 0 1 1-1z"/>
      </svg>
      Bookmarks
    </button>
  </nav>

  <script src="sidepanel.js"></script>
</body>
</html>
